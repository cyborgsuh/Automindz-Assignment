[project]
name = "pharmatalent-pipeline"
version = "0.1.0"
description = "PharmaTalent Europe lead discovery pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apify-client>=1.8.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "rapidfuzz>=3.9.0",
    "structlog>=24.4.0",
    "unidecode>=1.3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
pipeline = "pipeline.cli:main"
smoke-test = "pipeline.smoke_test:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
